<!--
  참고·보관용 원본 SVG. 실제 게임은 이 파일을 쓰지 않고
  src/components/sprites/monsters/FractureCore.tsx(색상 토큰/currentColor 버전)를 사용한다.
  README.md 참고.

  균열 밑선: 배경색(#080B0F)을 깔아 갈라진 틈을 표현하는 대신, mask로 육각
  윤곽선의 균열 자리를 실제로 투명하게 뚫었다 — 어떤 배경 위에 올려도
  자연스럽게 비쳐 보인다(FractureCore.tsx와 동일한 처리).
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <defs>
    <mask id="crack-mask" maskUnits="userSpaceOnUse" x="0" y="0" width="120" height="120">
      <rect x="0" y="0" width="120" height="120" fill="white"/>
      <path d="M40 32 L54 54 L42 62 L58 86" fill="none" stroke="black" stroke-width="4" stroke-linecap="round"/>
    </mask>
  </defs>
  <path d="M60 20 L94 40 L94 80 L60 100 L26 80 L26 40 Z" fill="none" stroke="#2DD4E0" stroke-width="1.8" mask="url(#crack-mask)"/>
  <path d="M40 32 L54 54 L42 62 L58 86" fill="none" stroke="#EF9F27" stroke-width="1.2"/>
  <circle cx="70" cy="60" r="9" fill="none" stroke="#EF9F27" stroke-width="1.5"/>
  <circle cx="70" cy="60" r="3.5" fill="#EF9F27"/>
</svg>
